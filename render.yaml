services:
  - type: web
    name: leetcoach-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: leetcoach-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: leetcoach-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AGENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://leetcoach-backend.onrender.com/api/auth/google/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://leetcoach-backend.onrender.com/api/auth/github/callback
      - key: CORS_ORIGIN
        value: https://leetcoach-ai.vercel.app
      - key: FRONTEND_URL
        value: https://leetcoach-ai.vercel.app

  - type: worker
    name: leetcoach-agents
    runtime: python
    rootDir: backend/agents
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leetcoach-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-pro
      - key: AGENT_SECRET
        sync: false
      - key: AGENT_PORT
        value: 8001
      - key: REDIS_URL
        fromService:
          name: leetcoach-redis
          type: redis
          property: connectionString

databases:
  - name: leetcoach-db
    plan: free
    databaseName: leetcoach_ai
    ipAllowList: []

redis:
  - name: leetcoach-redis
    plan: free
